# spec.host is filled from params.env by the replacements in kustomization.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: perfana-web
spec:
  host: PERFANA_HOST
  to: {kind: Service, name: perfana-web}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: perfana-api
  annotations:
    haproxy.router.openshift.io/timeout: 5m   # long analysis/export calls
spec:
  host: API_HOST
  to: {kind: Service, name: perfana-api}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
spec:
  host: KEYCLOAK_HOST
  to: {kind: Service, name: keycloak}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
spec:
  host: GRAFANA_HOST
  to: {kind: Service, name: grafana}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
