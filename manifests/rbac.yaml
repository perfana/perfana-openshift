# timescaledb-ha must run as its built-in postgres user (uid 1000): initdb refuses an
# arbitrary uid ("could not look up effective user ID"), which restricted-v2 assigns.
# nonroot-v2 permits any non-zero uid and nothing more. Granting it needs cluster-admin
# (or "use" on that SCC). The Perfana images (ubi9/) run under restricted-v2.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nonroot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nonroot-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: nonroot
