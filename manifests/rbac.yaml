# The CNPG operand image runs as uid 26; initdb refuses the random uid restricted-v2 assigns
# ("could not look up effective user ID ... user does not exist"). nonroot-v2 permits any
# non-zero uid and nothing more. The ServiceAccount is created by CNPG (named after the
# Cluster). Granting this needs cluster-admin (or "use" on that SCC).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perfana-db-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: perfana-db
