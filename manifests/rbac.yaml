# Two images must run as the uid baked into them, which restricted-v2 (random uid)
# does not allow:
#   postgres    timescaledb-ha initdb/pgdata expect uid 1000
#   perfana-web start-server.js rewrites public/__env.js and the CSP in
#               .next/routes-manifest.json at boot; those files are owned by 65532
#               and the writes fail silently under a random uid (Grafana iframes break)
# nonroot-v2 permits any non-zero uid and nothing more. Granting it needs
# cluster-admin (or "use" on that SCC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nonroot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nonroot-scc-nonroot-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: nonroot
