# Grafana. State lives in the "grafana" database in PostgreSQL (grafana.ini), so
# /var/lib/grafana is scratch (plugins are re-installed on start).
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4
          envFrom:
            - configMapRef: {name: perfana-params}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: GRAFANA_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            - {name: GF_SECURITY_ALLOW_EMBEDDING, value: "true"}
            - {name: GF_PLUGINS_PREINSTALL_SYNC, value: "marcusolsson-json-datasource,grafana-pyroscope-app"}
            # Consumed by grafana.ini / provisioning via env interpolation.
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: POSTGRES_PASSWORD}}
            - {name: PERFANA_ALERTS_WEBHOOK_URL, value: "http://perfana-api:3001/api/grafana-alerts"}
            # OAuth2 / Keycloak SSO. AUTH_URL is browser-facing; TOKEN/API are in-cluster.
            - {name: GF_SERVER_ROOT_URL, value: "https://$(GRAFANA_HOST)"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_OAUTH_AUTO_LOGIN, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_ENABLED, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_NAME, value: Perfana}
            - {name: GF_AUTH_GENERIC_OAUTH_ICON, value: signin}
            - {name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID, value: grafana}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: GRAFANA_OAUTH_CLIENT_SECRET}}
            - {name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: "openid profile email groups"}
            - {name: GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES, value: "false"}
            - {name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: "https://$(KEYCLOAK_HOST)/realms/perfana-prod/protocol/openid-connect/auth"}
            - {name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: "http://keycloak:8080/realms/perfana-prod/protocol/openid-connect/token"}
            - {name: GF_AUTH_GENERIC_OAUTH_API_URL, value: "http://keycloak:8080/realms/perfana-prod/protocol/openid-connect/userinfo"}
            - {name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_USE_PKCE, value: "true"}
            - {name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH, value: "contains(groups[*], 'perfana-admins') && 'Admin' || contains(groups[*], 'perfana-users') && 'Editor' || 'Viewer'"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: ini, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: ini, configMap: {name: grafana-ini}}
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: dashboard-providers, configMap: {name: grafana-dashboard-providers}}
        - {name: alerting, configMap: {name: grafana-alerting}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
