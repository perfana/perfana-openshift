# Keycloak — authentication / SSO, database in the shared PostgreSQL.
# Plain HTTP inside the cluster; the Route terminates TLS (edge), so production
# mode (`start`) is used instead of the compose file's `start-dev`.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args: [start, --import-realm]
          envFrom:
            - configMapRef: {name: perfana-params}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://perfana-db-rw:5432/keycloak"}
            - {name: KC_DB_USERNAME, value: perfana}
            - name: KC_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: perfana-db-app, key: password}}
            - {name: KC_DB_SCHEMA, value: public}
            - {name: KC_DB_POOL_INITIAL_SIZE, value: "5"}
            - {name: KC_DB_POOL_MIN_SIZE, value: "5"}
            - {name: KC_DB_POOL_MAX_SIZE, value: "20"}
            - {name: KC_HOSTNAME, value: $(KEYCLOAK_HOST)}
            - {name: KC_HOSTNAME_STRICT_BACKCHANNEL, value: "false"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: KEYCLOAK_ADMIN}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: KEYCLOAK_ADMIN_PASSWORD}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health/started, port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
