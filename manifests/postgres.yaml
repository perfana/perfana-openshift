# PostgreSQL + TimescaleDB. Holds the perfana, keycloak and grafana databases
# (the latter two created by postgres-init on first boot). Tuning args copied from
# poc-windows-wsl docker-compose.yml, which documents why each one is set; they are
# sized for a ~20 GB host — scale shared_buffers/effective_cache_size with the limits.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      serviceAccountName: nonroot
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: timescale/timescaledb-ha:pg15
          args:
            - -c
            - max_connections=500
            - -c
            - max_worker_processes=32
            - -c
            - max_locks_per_transaction=256
            - -c
            - client_connection_check_interval=10000
            - -c
            - log_lock_waits=on
            - -c
            - deadlock_timeout=1s
            - -c
            - shared_buffers=4GB
            - -c
            - effective_cache_size=12GB
            - -c
            - work_mem=32MB
            - -c
            - maintenance_work_mem=1GB
            - -c
            - max_wal_size=8GB
            - -c
            - bgwriter_delay=50ms
            - -c
            - bgwriter_lru_maxpages=1000
            - -c
            - bgwriter_lru_multiplier=4.0
            - -c
            - autovacuum_max_workers=6
            - -c
            - autovacuum_vacuum_cost_limit=2000
            - -c
            - random_page_cost=1.1
            - -c
            - effective_io_concurrency=200
            - -c
            - shared_preload_libraries=timescaledb,pg_stat_statements
            - -c
            - log_min_duration_statement=1000
          env:
            - {name: POSTGRES_DB, value: perfana}
            - {name: POSTGRES_USER, value: perfana}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: perfana-secrets, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, perfana, -d, perfana]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -U, perfana, -d, perfana]}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: "1", memory: 6Gi}
            limits: {memory: 12Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /home/postgres/pgdata}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: init
          configMap: {name: postgres-init}
        # Parallel query needs more than the default 64 MB /dev/shm.
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 200Gi}
